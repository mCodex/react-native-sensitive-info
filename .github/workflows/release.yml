name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment, or derive from conventional commits"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - prerelease
      dry-run:
        description: "Dry run (no publish, no push)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Verify release candidate
        run: |
          yarn lint:ci
          yarn test:coverage
          yarn build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_INCREMENT: ${{ inputs.increment }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(--ci)
          case "$RELEASE_INCREMENT" in
            auto) ;;
            patch|minor|major|prerelease) args+=("--increment=$RELEASE_INCREMENT") ;;
            *) echo "Unsupported increment: $RELEASE_INCREMENT" >&2; exit 1 ;;
          esac

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          yarn release "${args[@]}"
