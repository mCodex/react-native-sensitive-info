name: Build iOS

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-build.yml"
      - "package.json"
      - "example/package.json"
      - ".yarnrc.yml"
      - "src/**"
      - "scripts/**"
      - "nitrogen/specs/**"
      - "nitro.json"
      - "example/ios/**"
      - "example/Gemfile"
      - "example/Gemfile.lock"
      - "**/nitrogen/generated/shared/**"
      - "**/nitrogen/generated/ios/**"
      - "cpp/**"
      - "ios/**"
      - "**/Podfile.lock"
      - "**/yarn.lock"
      - "**/*.podspec"
      - "**/react-native.config.js"
      - "**/nitro.json"
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "package.json"
      - "example/package.json"
      - ".yarnrc.yml"
      - "src/**"
      - "scripts/**"
      - "nitrogen/specs/**"
      - "nitro.json"
      - "example/ios/**"
      - "example/Gemfile"
      - "example/Gemfile.lock"
      - "**/nitrogen/generated/shared/**"
      - "**/nitrogen/generated/ios/**"
      - "cpp/**"
      - "ios/**"
      - "**/Podfile.lock"
      - "**/yarn.lock"
      - "**/*.podspec"
      - "**/react-native.config.js"
      - "**/nitro.json"
  workflow_dispatch:

env:
  USE_CCACHE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App (New Architecture)
    runs-on: macOS-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "yarn"
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 16.4

      - name: Install dependencies (yarn)
        run: yarn install --immutable

      - name: Generate Nitro modules (codegen)
        run: yarn codegen

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: example

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-${{ runner.arch }}-pods-xcode-16.4-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile.lock', 'package.json', 'example/package.json') }}

      - name: Install Pods
        working-directory: example
        run: bundle exec pod install --project-directory=ios

      - name: Build App
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace SensitiveInfoExample.xcworkspace \
            -scheme SensitiveInfoExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sensitive-info-example-ios-simulator
          path: example/ios/build/Build/Products/Debug-iphonesimulator/SensitiveInfoExample.app
          if-no-files-found: error
          retention-days: 7
